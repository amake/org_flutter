name: org_flutter
description: Flutter widgets for displaying Emacs Org Mode (https://orgmode.org) content
version: 13.0.0
homepage: https://github.com/amake/org_flutter

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # flutter_highlighting not needed until pending issues addressed upstream; see
  # highlight.dart
  # flutter_highlighting: ^0.9.0+11.8.0
  flutter_slidable: ^4.0.0
  flutter_tex_js: ^7.0.0
  # flutter_tex_js:
  #   path: ../flutter_tex_js/flutter_tex_js
  highlighting: ^0.9.0+11.8.0
  org_parser: ^11.5.0
  # org_parser:
    # path: ../org_parser
  petitparser: ^7.0.1
  petit_lisp: ^6.5.0
  # petit_lisp:
    # path: ../petit_lisp
  more: ^4.7.0
  material_ui: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
